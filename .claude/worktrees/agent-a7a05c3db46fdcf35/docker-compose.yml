services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-report_app}
      POSTGRES_USER: ${DB_USER:-report_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-report_app}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
