server:
  forward-headers-strategy: framework
spring:
  application:
    name: report-app-backend
  jackson:
    time-zone: Asia/Tokyo
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:report_app}
    username: ${DB_USER:report_app}
    password: ${DB_PASSWORD:report_app}
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Tokyo'
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-handlers-package: com.reportapp.reportappbackend.mybatis
  configuration:
    map-underscore-to-camel-case: true
app:
  upload:
    dir: uploads
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
