services:

  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://172.16.1.162:5432/report_app_db # ←実際のDB名に合わせてください
      SPRING_DATASOURCE_USERNAME: あなたのDBユーザー名
      SPRING_DATASOURCE_PASSWORD: あなたのDBパスワード
      # ↓↓↓【ここを追記します】↓↓↓
      APP_CORS_ALLOWED_ORIGINS: https://meikoreport.com,https://www.meikoreport.com
    ports:
      - "8080:8080"
    restart: always

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: https://meikoreport.com/api
    environment:
      NEXT_PUBLIC_API_URL: https://meikoreport.com/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: always

volumes:
  uploads:
